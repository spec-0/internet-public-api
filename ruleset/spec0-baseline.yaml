# spec0-baseline — the public ruleset behind the registry's >= 90 admission gate.
#
# Philosophy: this ruleset measures whether a spec is STRUCTURALLY SOUND and USABLE by
# machines (agents, codegen, mocking) — not whether it matches any particular style guide.
# It is deliberately relaxed: the world's flagship public APIs should all clear 90 for the
# right reasons, and a failure should mean something is genuinely broken or ambiguous
# (e.g. unresolvable $refs, duplicate operationIds, undeclared path parameters).
#
# Calibrated against the mirrored corpus with the same engine the registry runs.
# Style rules that punish deliberate API-design choices (Stripe's snake_case properties,
# terse repeated descriptions, missing examples) are off: they say nothing about whether
# a machine can consume the contract.
#
# version: 3

extends: [[spectral:oas, recommended]]

rules:
  # ── Structural soundness stays ON (these are why the gate exists) ─────────────
  path-params: error
  path-declarations-must-exist: error
  no-eval-in-markdown: error
  operation-operationId-unique: error

  # ── Style / documentation-completeness rules OFF — not what this gate measures ─
  camel-case-properties: off          # naming convention is the API owner's choice
  description-duplication: off        # repeated terse descriptions are style, not breakage
  oas3-missing-example: off           # examples are nice-to-have, not structural
  no-$ref-siblings: off               # ubiquitous in real specs; tooling ignores siblings
  info-contact: off
  info-description: off
  info-license: off
  license-url: off
  oas3-api-servers: off
  openapi-tags: off
  operation-tags: off
  operation-tag-defined: off
  operation-singular-tag: off
  operation-description: off
  oas3-parameter-description: off
  component-description: off
  operation-operationId-valid-in-url: off
  oas3-unused-component: off
  paths-kebab-case: off               # Stripe et al. use snake_case path segments by design
  no-unnecessary-combinator: off      # optimization advice, not soundness
  no-request-body: off                # GET/DELETE bodies are the producer's call
  oas-schema-check: off               # e.g. `minimum` on a string: sloppy, harmless to tooling
  oas3-valid-schema-example: off      # example validity is nice-to-have, not structural
  nullable-enum-contains-null: off

  # ── Demoted to warnings — real signal, but shouldn't sink an otherwise-sound spec ─
  operation-operationId: warn
  duplicated-entry-in-enum: warn
  typed-enum: warn
  no-ambiguous-paths: warn
  path-keys-no-trailing-slash: warn
  no-script-tags-in-markdown: warn
